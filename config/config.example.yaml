# Example configuration for LLM Interactive Proxy

# Server settings
host: "127.0.0.1"
port: 8000
# Publicly accessible URL for the proxy (required for correct SSO redirects when deployed)
# If not set, defaults to http://{host}:{port}. Required if binding to 0.0.0.0 or behind a reverse proxy.
public_url: null  
proxy_timeout: 120
command_prefix: "!/"

# Activity tracking (disabled by default for performance)
# Enable via CLI: --enable-activity-tracking
# Enable via env: ENABLE_ACTIVITY_TRACKING=1
enable_activity_tracking: false

# ACP backends (gemini-cli-acp, cursor-cli-acp, agy-cli-acp, eve-acp): after each completed chat turn, schedule
# termination of the pooled agent subprocess after idle seconds (default 3600 = 60 minutes).
# Disable with:
#   CLI: --disable-stale-acp-agent-kills
#   Env: DISABLE_STALE_ACP_AGENT_KILLS=true
# Override idle delay with:
#   CLI: --stale-acp-agent-kill-idle-seconds <seconds>
#   Env: STALE_ACP_AGENT_KILL_IDLE_SECONDS=<seconds>
#   This file: stale_acp_agent_kill_idle_seconds: 7200
# CLI overrides env overrides this file.
disable_stale_acp_agent_kills: false
stale_acp_agent_kill_idle_seconds: 3600

# Append file contents once per session to the first user message (HTTP chat only).
# File must be .txt or .md; read once at startup (restart to reload). INFO logs confirm
# load and each first-time merge (suffix length only, not content). CLI/env see README.
auto_append_first_prompt_filename: null

# Authentication
auth:
  disable_auth: false  # Set to true to disable API key authentication
  # NOTE: API keys should NEVER be stored in config files for security reasons
  # Instead, set them via environment variables (see README.md)
  api_keys: []  # API keys are read from environment variables only
  auth_token: null  # Optional auth token
  brute_force_protection:
    enabled: true  # Enable automatic blocking for repeated invalid API keys
    max_failed_attempts: 5  # Allow this many failures before blocking begins
    ttl_seconds: 900  # Window (seconds) for counting failures per IP
    initial_block_seconds: 30  # First block duration once threshold is exceeded
    block_multiplier: 2.0  # Each subsequent block grows by this multiplier
    max_block_seconds: 3600  # Cap the block duration to one hour

# File Access Sandboxing
# Security feature that restricts LLM agents from performing file-changing operations
# outside detected project root directory. This prevents agents from accidentally
# or maliciously modifying files in sensitive system locations.
# See docs/user_guide/features/file-sandboxing.md for complete documentation.
# Enable via CLI: --enable-sandboxing
# Enable via env: ENABLE_SANDBOXING=true
sandboxing:
  enabled: false  # Enable/disable file access sandboxing
  strict_mode: false  # Block tool calls with unparseable paths (default: false)
  allow_parent_access: false  # Allow access to parent directories of project root (default: false)
  # Additional regex patterns for file-changing tools (optional)
  custom_tool_patterns: []
  # Regex patterns for tools to exempt from sandboxing (optional)
  excluded_tools: []

# Empty response / empty stream recovery
empty_response:
  enabled: true
  max_retries: 1
  # When true, reasoning-only streaming deltas count as meaningful output for empty-stream
  # detection (avoids false retries when models stream reasoning before assistant text).
  # Disable via env: EMPTY_RESPONSE_COUNT_REASONING_FOR_EMPTY_STREAM=false
  count_reasoning_for_empty_stream: true

# Session management
session:
  cleanup_enabled: true
  cleanup_interval: 3600  # 1 hour

  # Session continuity (proxy-side heuristic session reuse when clients do not send session ids)
  session_continuity:
    enabled: true
    fuzzy_matching: true
    max_session_age_seconds: 604800  # 7 days
    fingerprint_message_count: 5
    client_key_includes_ip: false  # IPs are ignored for session continuity
    # Topic similarity is inherently weaker and can increase risk of cross-session merges.
    # Disabled by default. Enable only if you understand the trade-offs.
    enable_topic_similarity_matching: false

  # Client compatibility (frontend-facing behavior)
  #
  # Prefer explicit headers from the client when possible:
  #   - x-llmproxy-reasoning-mode: passthrough | coerce_to_content | drop
  #   - x-llmproxy-reasoning-meaningful: true | false
  #
  # If the client cannot set headers, you can configure UA-based defaults here.
  client_compatibility:
    reasoning_mode_header: x-llmproxy-reasoning-mode
    reasoning_meaningful_header: x-llmproxy-reasoning-meaningful
    user_agent_rules:
      - name: opencode-defaults
        enabled: true
        user_agent_regex: "opencode/"
        reasoning_mode: coerce_to_content
        reasoning_counts_as_meaningful: true

  max_age: 86400  # 1 day
  default_interactive_mode: true
  # Streaming/content loop detection (HybridLoopDetector). Default false; set true to opt in.
  streaming_loop_detection_enabled: false
  force_set_project: false
  project_dir_resolution_model: null  # Optional BACKEND:MODEL for auto-detecting project directories
  project_dir_resolution_mode: hybrid
  project_dir_resolution_filesystem_mode: auto  # auto|enabled|disabled; auto follows access_mode (single_user => enabled, multi_user => disabled)
  disable_default_openrouter_project_dir_resolution_fallback: false  # Disable automatic single-user LLM fallback via openrouter:openrouter/free when deterministic detection fails and OPENROUTER_API_KEY is available

  # Tool call reactor steering for pytest full-suite runs (requires opt-in)
  pytest_full_suite_steering_enabled: false

  # Steering for shell commands using cat > / cat >> to create or append files (opt-in)
  cat_file_edits_steering_enabled: false

  # Test execution reminder system
  # Tracks file modifications and test executions, reminding agents to run tests
  # before completing tasks when code changes haven't been verified.
  # When enabled, the system:
  # - Detects file modification tool calls (write_file, str_replace, etc.)
  # - Detects test execution commands across multiple languages
  # - Reminds agents to run tests before task completion if changes are unverified
  # Default: false (opt-in feature)
  test_execution_reminder_enabled: false
  # Optional custom reminder message. If not set, uses default message:
  # "You have made code changes but haven't run tests yet. Please run the test
  # suite to verify your changes before completing this task. Once tests pass,
  # you can proceed with task completion."
  test_execution_reminder_message: null

  # Fix improperly formatted <think> tags in model responses
  fix_think_tags_enabled: false  # Set to true to enable think tags correction

  # Remove trailing [AUTO-CONTINUE] marker from assistant responses.
  auto_continue_removal_enabled: true

  # Planning phase: Route initial requests to a strong model for better planning
  planning_phase:
    enabled: false  # Set to true to enable planning phase
    strong_model: "openai:gpt-4"  # Strong model for planning (backend:model format)
    max_turns: 10  # Maximum turns before switching back to default model
    max_file_writes: 1  # Maximum file writes before switching back to default model

  # Quality Verifier model (experimental)
  # When set, the proxy will submit each assistant response to the Quality Verifier model for verification
  # and may request a correction before delivering to the client.
  # Format: BACKEND:MODEL with optional URI params, e.g.:
  #   "openai:gpt-4o-mini?temperature=1&reasoning_effort=high"
  quality_verifier_model: null
  # Quality Verifier frequency (1 = every user turn, 5 = every 5th user turn, etc.)
  # Note: verification runs only on eligible turns (main-model turns). Tool-result
  # continuations and random replacement-model turns are excluded.
  quality_verifier_frequency: 10
  # Eligible-turn increment per tool-result follow-up (0.0 = ignore tool steps; default 0.2)
  quality_verifier_tool_followup_weight: 0.2
  # Truncate history for Quality Verifier to N messages (optional, default: unlimited)
  quality_verifier_max_history: null
  # Maximum consecutive failures for Quality Verifier model before tripping circuit breaker
  # Default: 5
  quality_verifier_max_consecutive_failures: 5
  # Cooldown period in seconds for Angel circuit breaker
  # Default: 300 (5 minutes)
  quality_verifier_cooldown_seconds: 300

  # Tool progress loop guard (cross-request repeated tool call/output detection)
  # Set to false to completely disable tool progress loop detection.
  tool_progress_loop_guard_enabled: true
  tool_progress_loop_max_consecutive_followups: 50
  tool_progress_loop_max_repeated_call_signature: 7
  tool_progress_loop_max_repeated_output: 7
  tool_progress_loop_action: steer_then_error  # error | steer_then_error
  tool_progress_loop_steering_message: null

  # Tool call processing behavior
  # These settings control how tool calls are processed to prevent re-processing of historical messages
  # 
  # By default, the system tracks which messages have been processed and skips re-processing
  # historical tool calls on subsequent requests. This significantly improves performance
  # when dealing with long conversation histories (70+ messages).
  #
  # force_reprocess_tool_calls: Controls whether to bypass the processing marker checks
  #   - Default: false (recommended for production)
  #   - Set to true to force reprocessing of all tool calls
  #   - Use cases:
  #     * Debugging tool call processing issues
  #     * Testing changes to tool call repair logic
  #     * Investigating unexpected behavior in tool call handling
  #   - Note: Enabling this will reduce performance with long conversation histories
  #
  # log_skipped_tool_calls: Controls visibility of skipped message logging
  #   - Default: false (recommended for production to reduce log noise)
  #   - Set to true to log when messages are skipped
  #   - Use cases:
  #     * Understanding which messages are being optimized
  #     * Verifying the optimization is working correctly
  #     * Development and debugging of the processing system
  #   - Note: Logs are emitted at TRACE level (level 5) to minimize noise
  force_reprocess_tool_calls: false
  log_skipped_tool_calls: false

# ProxyMem (Cross-Session Memory)
memory:
  available: false
  default_enabled: false
  summary_model: null  # backend:model
  context_model: null  # backend:model
  summary_prompt: null  # Path to custom prompt (.txt or .md)
  context_prompt: null  # Path to custom prompt (.txt or .md)
  database_path: "./var/memory.sqlite3"
  session_timeout_minutes: 30
  summarization_delay_seconds: 120
  max_sessions_to_consider: 10
  max_context_tokens: 2000
  max_summary_tokens: 800
  max_transcript_chars: 50000
  summary_completion_tokens: 10000
  context_relevance_threshold: 0.5
  retention_days: 90
  max_buffer_size_bytes: 10485760
  analysis_queue_maxsize: 100
  analysis_timeout_seconds: 30
  max_concurrent_analyses: 4
  context_template: null  # Use {context} placeholder
  redaction_patterns: []
  persist_transcript: false
  disabled_users: []
  disabled_clients: []
  single_user_mode: false
  fixed_user_id: null
  summary_prompt_version: "v1"
  summary_schema_version: "v1"
  require_project_discovery: true
  project_discovery_mode: "any"

# History Compaction
# Reduces context size by compacting stale tool outputs in long conversations.
# This helps maintain performance and stay within context limits.
compaction:
  enabled: false  # Default: false. usage: true to enable.
  token_threshold: 100000  # Minimum tokens required to trigger compaction. Default: 100,000.
  # redact_resource_identifiers: false  # Set to true to redact file paths/commands in stubs (more secure, less debuggable)

# Dynamic tool-output compression (strategy-based, request-path)
# Runs after history compaction and before backend translation.
dynamic_compression:
  enabled: false
  level: "conservative"         # conservative | balanced | aggressive
  max_level: "aggressive"       # escalation ceiling
  min_bytes: 1024               # skip tiny outputs
  telemetry_include_content_hashes: true  # correlation-safe hashes only (no raw payload logging)
  alerts:
    enabled: true
    failure_threshold: 5        # warn when method failures repeat within window
    fallback_threshold: 8       # warn when fallback/skipped paths repeat within window
    window_seconds: 300
    cooldown_seconds: 300       # rate-safe alert cooldown
  recovery:
    mode: "never"               # never | failures | always
    min_original_bytes: 4096
    min_saved_bytes: 2048
    max_artifact_bytes: 262144
    max_artifacts: 128
    retention_seconds: 86400
    storage_dir: "var/compression_recovery"
    hint_in_text: false         # append handle hint to plain text outputs when allowed
  disable_categories: []        # e.g. ["search"]
  disable_methods: []           # e.g. ["line_dedupe"]
  disable_tools: ["read", "read_file"]  # built-in defaults protect high-signal file reads; add e.g. ["shell"] to opt out others
  disable_tool_name_substrings: []  # e.g. ["fff", "mcp_"] matches anywhere in tool name
  disable_command_prefixes: []  # e.g. ["git diff --stat"]
  # Listing/search/read strategy tuning
  noise_directories: ["node_modules", ".git", "target", "__pycache__", ".venv", "vendor"]
  search_context_lines: 2
  search_max_matches_per_file: 8
  search_max_total_groups: 100
  search_max_line_length: 240
  file_detail_mode: "auto"             # auto | full | structure | signatures
  file_detail_fallback_mode: "full"    # full | structure | signatures
  file_detail_auto_full_max_lines: 120
  file_detail_auto_structure_max_lines: 280
  file_detail_include_line_numbers: false
  file_detail_max_lines: null          # head-like cap when set
  file_detail_last_n_lines: null       # tail-like cap when set
  # Generic pattern and diff controls
  output_pattern_rules: []
  output_pattern_regex_timeout_ms: 25
  # Declarative operator-defined rules (8-stage text pipeline)
  declarative_rules: []
  declarative_rule_files: []        # Optional extra YAML/JSON files containing declarative_rules
  declarative_regex_timeout_ms: 25  # Bounded regex evaluation for full-output matching stages
  diff_max_lines_per_hunk: 100
  diff_max_total_lines: 500

# Canonical request-processing runtime controls
canonical_request_processing:
  empty_stream_recovery_prompt: "The previous response was empty, please try again."
  max_empty_stream_retries: 1

# Logging
logging:
  level: "INFO"  # TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL
  # Standardize where console logs go.
  # "stderr" is the Python default; "stdout" can be more convenient when piping.
  console_stream: "stderr"  # stdout|stderr
  request_logging: false
  response_logging: false
  log_file: null  # Optional log file path (e.g., "var/logs/proxy.log")
  cbor_capture_dir: null # Optional directory for CBOR captures (e.g., "var/logs/wire_captures_cbor")
  cbor_capture_flush_interval: 1.0 # Seconds between CBOR buffer flushes (only if dirty)

# Backend settings
# IMPORTANT SECURITY NOTE:
# API keys should NEVER be stored in configuration files!
# All API keys must be set via environment variables only:
# - OPENROUTER_API_KEY for OpenRouter
# - GEMINI_API_KEY for Gemini
# - ANTHROPIC_API_KEY for Anthropic
# - ZAI_API_KEY for ZAI
# - NVIDIA_API_KEY for Nvidia (NIM OpenAI-compatible API)
# - RUNINFRA_API_KEY for Runinfra (runinfra.ai OpenAI-compatible API)
# - GOOGLE_CLOUD_PROJECT for Google Cloud Project ID
# See README.md and config/sample.env for examples

backends:
  default_backend: "openai"
  # hybrid_backend_repeat_messages: false  # Set to true to repeat reasoning output as an artificial message in the session
  interleaved_thinking_instructions_file: "config/prompts/interleaved_thinking/thinker_prompt.md"  # File injected only into [thinker] routed requests
  interleaved_thinking_stream_to_client: false  # Stream sanitized thinker text to the client before executor output
  interleaved_thinking_regular_turns_remaining: 2  # Regular executor turns that suppress thinker selection after storing a memo

  openai:
    # API key set via OPENROUTER_API_KEY environment variable
    api_url: null  # Optional custom API URL
    timeout: 120
    models:
      - "gpt-3.5-turbo"
      - "gpt-4"
      - "gpt-4-turbo"

  openrouter:
    # API key set via OPENROUTER_API_KEY environment variable
    api_url: "https://openrouter.ai/api/v1"
    timeout: 180

  opencode-go:
    # API key set via an environment variable
    api_url: "https://opencode.ai/zen/go/v1"
    timeout: 120
    models:
      - "glm-5"
      - "glm-5.1"
      - "kimi-k2.5"
      - "kimi-k2.6"
      - "deepseek-v4-pro"
      - "deepseek-v4-flash"
      - "mimo-v2.5"
      - "mimo-v2.5-pro"
      - "mimo-v2-pro"
      - "mimo-v2-omni"
      - "minimax-m2.7"
      - "minimax-m2.5"
      - "qwen3.6-plus"
      - "qwen3.5-plus"
    extra:
      model_protocol_overrides:
        # Example override for future upstream protocol changes.
        # custom-model: anthropic

  # nvidia:
  #   # NVIDIA NIM / hosted integrator OpenAI-compatible chat API.
  #   # Default base URL when api_url is omitted: https://integrate.api.nvidia.com/v1
  #   # Set api_url to your self-hosted NIM OpenAI base if not using the hosted integrator.
  #   # Secrets: use NVIDIA_API_KEY in the environment (do not put real keys in YAML).
  #   # Precedence: proxy-wide CLI > ENV > YAML where applicable; for this backend, an explicit
  #   # api_key passed into connector initialization (e.g. from YAML) overrides NVIDIA_API_KEY,
  #   # which is only used when no api_key is supplied in init kwargs.
  #   # api_url: null
  #   # timeout: 120  # Also raises httpx *read* (inter-SSE-chunk) timeout; connector enforces
  #   # a floor (~300s) vs the shared pool default so long reasoning pauses do not abort streams.
  #   # models: []  # Optional static allowlist; with no API key and no models list, discovery is empty

  # runinfra:
  #   # runinfra.ai OpenAI-compatible chat API.
  #   # Default base URL when api_url is omitted: https://api.runinfra.ai/v1
  #   # Secrets: use RUNINFRA_API_KEY in the environment (do not put real keys in YAML).
  #   # api_url: null
  #   # timeout: 120
  #   # models: []  # Optional static allowlist

  anthropic:
    # API key set via ANTHROPIC_API_KEY environment variable
    timeout: 150

  gemini:
    # GEMINI_API_KEY environment variable
    timeout: 120
    extra:
      # Gemini request adjustments (shared across Gemini connectors)
      # strip_reasoning_content: remove assistant reasoning_content to match gemini-cli (default: true)
      strip_reasoning_content: true
      # Optional tool output truncation (disabled by default).
      # Automatically skipped when history compaction is enabled.
      tool_output_truncate_chars: null  # e.g. 40000
      tool_output_truncate_lines: null  # e.g. 200
      # Log level for "skipping truncation because compaction is enabled" message.
      # Set to "DEBUG", "INFO", etc. Use "off" to disable. Default: null (no log).
      tool_output_truncation_log_level: null

  gemini_oauth_auto:
    # Multi-account Gemini connector with automatic token refresh and rotation.
    # To add accounts, run: python scripts/manage_gemini_accounts.py add
    timeout: 120
    extra:
      accounts: all  # List of account IDs or "all"
      refresh_buffer_seconds: 300
      selection_strategy: "round-robin"
      storage_path: "var/gemini_oauth_accounts"
      # Gemini request adjustments (shared across Gemini connectors)
      # strip_reasoning_content: remove assistant reasoning_content to match gemini-cli (default: true)
      strip_reasoning_content: true
      # Optional tool output truncation (disabled by default).
      # Automatically skipped when history compaction is enabled.
      tool_output_truncate_chars: null  # e.g. 40000
      tool_output_truncate_lines: null  # e.g. 200
      # Log level for "skipping truncation because compaction is enabled" message.
      # Set to "DEBUG", "INFO", etc. Use "off" to disable. Default: null (no log).
      tool_output_truncation_log_level: null


  # Note: qwen-oauth backend is configured via backend-instances file:
  # config/backends/backend-instances/qwen-oauth.default.yaml
  #
  # cursor-cli-acp (Cursor CLI Agent Client Protocol): optional instance file
  # config/backends/backend-instances/cursor-cli-acp.default.yaml
  # Install Cursor CLI, run `agent login`, ensure `agent` is on PATH (Windows: agent.cmd).
  #
  # eve-acp (Vercel Eve Agent Client Protocol): optional instance file
  # config/backends/backend-instances/eve-acp.default.yaml
  # Ensure `eve` is on PATH or configure `eve_executable`.
  #
  # qwen-oauth retry tuning knobs (in that backend-instances file under `extra:`):
  #   enable_qwen_oauth_initial_rate_limit_retry: true
  #   qwen_oauth_initial_rate_limit_retry_max_wait_seconds: 10.0
  #   qwen_oauth_initial_rate_limit_retry_random_min_seconds: 3.0
  #   qwen_oauth_initial_rate_limit_retry_random_max_seconds: 10.0

  kiro_oauth_auto:
    # Amazon Kiro / Q Developer OAuth connector
    # To add accounts, run manage_kiro_accounts.py from llm-interactive-proxy-oauth-connectors (see docs/user_guide/backends/kiro-oauth-auto.md)
    timeout: 120
    # Static model list - Kiro backend has no model enumeration endpoint
    models:
      - "amazon/claude-sonnet-4.5"
      - "amazon/claude-opus-4.5"
      - "amazon/claude-opus-4.6"
      - "amazon/claude-haiku-4.5"
    extra:
      storage_path: "var/kiro_oauth_accounts"
      selection_strategy: "first-available"
      refresh_buffer_seconds: 300
      # 402 MONTHLY_REQUEST_COUNT: default backoff until next UTC month (min 86400s).
      # Use fixed_seconds for a constant window (e.g. 604800 = 7d).
      monthly_quota_backoff_mode: "next_calendar_month_utc"
      monthly_quota_backoff_fixed_seconds: 604800
      monthly_quota_backoff_min_seconds: 86400
      # Optional upper bound (seconds) on monthly-quota backoff; null = no cap
      monthly_quota_backoff_max_seconds: null
      # Reload account JSON from disk at most this often (seconds); 0 disables
      account_reload_interval_seconds: 60
      transient_rate_limit_default_seconds: 30
      transient_rate_limit_max_seconds: 3600

  zai:
    # API key set via ZAI_API_KEY environment variable
    timeout: 120

  zai-coding-plan:
    # API key set via ZAI_CODING_PLAN_API_KEY environment variable
    timeout: 120

  internlm:
    # API key set via INTERNAI_API_KEY environment variable
    # Multiple keys supported: INTERNAI_API_KEY (primary), INTERNAI_API_KEY_1, INTERNAI_API_KEY_2, etc.
    # Keys are rotated round-robin for load balancing
    timeout: 120

  openai_codex:
    # API key set via OpenAI OAuth flow (see docs)
    timeout: 120
    # Enthusiast mode defaults: client tools only, no server-side execution, no environment leakage
    # These settings make the connector behave as a transparent proxy for third-party agents
    extra:
      codex:
        # WebSocket transport (opportunistic support for ChatGPT backend API)
        websocket:
          enabled: false  # Set to true to enable WebSocket transport for Codex

        # Model catalog auto-discovery + fallback. By default the proxy runs
        # `codex debug models` at startup to learn supported model slugs and
        # per-model reasoning-effort settings; on any failure it falls back to
        # the shipped snapshot (src/resources/codex/codex_model_catalog.json).
        # Set discovery_enabled: false to skip discovery and always use the
        # fallback file. Override fallback_path to use a custom snapshot.
        model_catalog:
          discovery_enabled: true
          # fallback_path: /etc/llm-proxy/codex_model_catalog.json
          # codex_binary_path: /usr/local/bin/codex
          discovery_timeout_seconds: 10.0

        # When ChatGPT-account Codex rejects gpt-5.5 (e.g. free plan), downgrade to target.
        gpt55_unsupported_free_plan_downgrade:
          enabled: true
          proactive_enabled: true   # use x-codex-plan-type / usage_limit plan_type when known
          reactive_enabled: true   # retry once after HTTP 400 with known detail
          source_model: gpt-5.5
          target_model: gpt-5.4
          free_plan_types: [free]

        # First N proxy session turns force temperature=1 and verbosity=high
        # on the resolved request (enabled by default; set enabled: false to
        # opt out). ChatGPT Codex rejects temperature on the wire, so only
        # text.verbosity=high is sent outbound.
        early_session_verbosity_bump:
          enabled: true
          max_turns: 5
        
        default_capabilities:
          protocol: openai-chat
          codex_passthrough: false
          prompt_mode: codex_default
          tool_schema_mode: custom_only
          tool_text_format: none
          bypass_tool_call_reactor: true
          include_environment_context: false
        # Managed OAuth accounts used by openai-codex.
        # Configure accounts via: ./.venv/Scripts/python.exe scripts/manage_openai_codex_accounts.py add
        managed_oauth:
          enabled: true
          storage_path: "var/openai_codex_oauth_accounts"
          # "all" or explicit list of account_id and/or chatgpt_account_id values
          # (must match each JSON file's account_id or its chatgpt_account_id field).
          accounts: "all"
          selection_strategy: "round-robin"  # round-robin|random|first-available|session-affinity
          refresh_buffer_seconds: 300
          session_affinity_ttl_seconds: 86400
          session_affinity_max_entries: 10000
          allow_legacy_fallback: true  # if no managed accounts exist, use ~/.codex/auth.json
          # Max seconds to sleep while waiting for a rate-limited account to clear (rotation).
          max_rate_limit_wait_seconds: 300
          # Caps local per-account cooldown when upstream sends huge resets_in_seconds (full
          # upstream metadata is still stored on each account file).
          rate_limit_local_cooldown_cap_seconds: 1800
          # Max sleep iterations when every account is rate-limited (each slice up to
          # max_rate_limit_wait_seconds).
          max_rate_limit_idle_polls: 48
          # Desktop alerts when remaining Codex quota (100 - x-codex-*-used-percent) is low.
          quota_remaining_alerts_enabled: true
          # Notify when remaining quota drops strictly below each percent (defaults: 25 then 10).
          quota_remaining_alert_thresholds_percent: [25, 10]
          # Optional env overrides: OPENAI_CODEX_QUOTA_REMAINING_ALERTS_ENABLED,
          # OPENAI_CODEX_QUOTA_REMAINING_THRESHOLDS (JSON array e.g. [25,10] or comma-separated).
    # For Responses API clients (Profile B), use:
    #   default_capabilities:
    #     protocol: openai-responses
    #     codex_passthrough: true
    #     prompt_mode: codex_default
    #     tool_schema_mode: custom_only
    #     tool_text_format: none
    #     bypass_tool_call_reactor: true
    #     include_environment_context: false

  openai_codex_v2:
    # Experimental Codex connector: websocket v2 + strict delta continuation.
    # Shares managed OAuth storage and semantics with ``openai_codex`` by default.
    timeout: 120
    extra:
      codex:
        websocket:
          enabled: true
          beta_mode: v2
        # Model catalog auto-discovery + fallback (same keys as openai_codex).
        # See openai_codex.extra.codex.model_catalog for details.
        model_catalog:
          discovery_enabled: true
          discovery_timeout_seconds: 10.0
        # Same keys as ``openai_codex.extra.codex`` (shared SettingsLoader).
        gpt55_unsupported_free_plan_downgrade:
          enabled: true
          proactive_enabled: true
          reactive_enabled: true
          source_model: gpt-5.5
          target_model: gpt-5.4
          free_plan_types: [free]
        # First N proxy session turns force temperature=1 and verbosity=high
        # on the resolved request (enabled by default; set enabled: false to
        # opt out). ChatGPT Codex rejects temperature on the wire, so only
        # text.verbosity=high is sent outbound.
        early_session_verbosity_bump:
          enabled: true
          max_turns: 5
        default_capabilities:
          protocol: openai-chat
          codex_passthrough: false
          prompt_mode: codex_default
          tool_schema_mode: custom_only
          tool_text_format: none
          bypass_tool_call_reactor: true
          include_environment_context: false
        managed_oauth:
          enabled: true
          storage_path: "var/openai_codex_oauth_accounts"
          accounts: "all"
          selection_strategy: "round-robin"
          refresh_buffer_seconds: 300
          session_affinity_ttl_seconds: 86400
          session_affinity_max_entries: 10000
          allow_legacy_fallback: true
          max_rate_limit_wait_seconds: 300
          rate_limit_local_cooldown_cap_seconds: 1800
          max_rate_limit_idle_polls: 48
          quota_remaining_alerts_enabled: true
          quota_remaining_alert_thresholds_percent: [25, 10]

# Model-specific defaults
model_defaults:
  "gpt-4":  # Exact model name
    temperature: 0.7

  "openai-codex:gpt-5.5":
    # ChatGPT-account Codex currently rejects larger contexts remotely with
    # context_length_exceeded; enforce locally so clients can compact immediately.
    limits:
      context_window: 260000
      max_input_tokens: 260000
  
  "openrouter:claude-3-opus":  # Backend:model format
    reasoning_effort: "high"

# Failover routes
failover_routes:
  default:
   policy: "ordered"
   elements:
     - "openai:gpt-4"
     - "openrouter:anthropic/claude-3-opus-20240229"

# Resilience scoping (personal vs shared backends)
# Defaults treat oauth/codex backends as personal without configuration.
resilience:
  # Force personal scoping for selected backends (optional override).
  # Example: ["openai-codex", "qwen-oauth"]
  personal_backend_types: []
  # Force shared scoping for selected backends (optional override).
  shared_backend_types: []

# Scheduled provider warm-up for sliding usage windows.
# Sends lightweight prompts at fixed local server times to intentionally start
# request windows at more favorable times of day.
# Only explicit backend:model routes are allowed. Aliases, model-only selectors,
# and composite selectors using ^ or | are rejected.
usage_window_warmup:
  enabled: false
  entries: []
  # Example:
  # entries:
  #   - model: "openai-codex:gpt-5.4-mini"
  #     time: "08:00"
  #     execute_on_weekend: false
  #   - model: "gemini.2:google/gemini-2.5-flash"
  #     time: "13:30"
  #     execute_on_weekend: false
  #   - model: "gemini.2:google/gemini-2.5-flash"
  #     time: "18:45"
  #     execute_on_weekend: true

# Model name rewrite rules (optional)
# These rules allow you to dynamically rewrite model names before they are processed
# Rules are processed in order, and the first matching rule is applied
# model_aliases:
#   # Statically replace a specific model
#   - pattern: "^claude-3-sonnet-20240229$"
#     replacement: "gemini-oauth-plan:gemini-1.5-flash"
#
#   # Dynamically replace any GPT model, keeping the version
#   - pattern: "^gpt-(.*)"
#     replacement: "openrouter:openai/gpt-\\1"
#
#   # Catch-all for any other model
#   - pattern: "^(.*)$"
#     replacement: "gemini-oauth-plan:gemini-1.5-pro"

# Random Model/Backend Replacement
# Probabilistically replace user-specified backend:model with an alternative
# to improve session diversity and provide resilience when models encounter difficulties
# See docs/user_guide/features/random-model-replacement.md for complete documentation
# replacement:
#   enabled: false  # Set to true to enable random model replacement
#   probability: 0.3  # Probability (0.0-1.0) of triggering replacement (0.3 = 30% chance)
#   replacement_rules:
#     - from_pattern: "*"  # Wildcard: matches all models
#       to_backend: "qwen-oauth"
#       to_model: "qwen3-coder-plus"
#     - from_pattern: "gpt-4"  # Partial match: matches any model containing "gpt-4"
#       to_backend: "openai"
#       to_model: "gpt-3.5-turbo"
#     - from_pattern: "openai:gpt-4"  # Exact match: matches specific backend:model
#       to_backend: "anthropic"
#       to_model: "claude-3-5-sonnet"
#   # Legacy format (automatically converted to wildcard rule if replacement_rules is empty):
#   # backend_model: "qwen-oauth:qwen3-coder-plus"
#   turn_count: 3  # Number of consecutive turns to use replacement model once activated

# Model Registry & Limit Enforcement
# External registry for model metadata (context windows, pricing, capabilities)
# and automated request limit enforcement.
model_registry:
  download_enabled: true  # Whether to download updates from external registry
  url: "https://models.dev/api.json"  # Registry URL
  update_interval_seconds: 86400  # Check for updates every 24 hours
  # cache_path: "./var/model_registry/models.dev.json"
  # bootstrap_path: "./src/resources/model_registry/models.dev.json"

model_limit_enforcement:
  enabled: true  # Enforce context window and token limits based on registry data

# Reasoning-model token floor
# Raises low max_tokens/max_completion_tokens for reasoning-first models to prevent empty assistant messages.
reasoning_model_token_floor:
  enabled: true
  # models: Model ID (normalized, e.g. stepfun/step-3.5-flash:free) -> minimum output tokens.
  # Defaults include stepfun/step-3.5-flash:free, kimi/kimi-for-coding, kimi-for-coding at 512.
  # Override or extend as needed:
  # models:
  #   stepfun/step-3.5-flash:free: 512
  #   kimi/kimi-for-coding: 512

# OpenAI Responses API WebSocket support
# Enables WebSocket transport for low-latency, persistent connections
# optimized for tool-call-heavy workflows (up to 40% faster for 20+ tool calls)
responses_api:
  websocket:
    # Enable WebSocket transport for client connections (client -> proxy)
    frontend_enabled: false
    # Enable WebSocket transport for backend connections (proxy -> OpenAI)
    backend_enabled: false
    # WebSocket endpoint path (default: /v1/responses)
    frontend_path: "/v1/responses"
    # Connection timeout in seconds (default: 3600 = 60 minutes per OpenAI limit)
    connection_timeout: 3600
    # Maximum concurrent WebSocket connections
    max_connections: 100
