$schema: "http://json-schema.org/draft-07/schema#"
title: App Config
type: object
additionalProperties: false
properties:
  host: { type: string }
  port: { type: integer, minimum: 1 }
  public_url: { type: ["string", "null"] }
  anthropic_port: { type: ["integer", "null"], minimum: 1 }
  proxy_timeout: { type: integer, minimum: 0 }
  command_prefix: { type: string }
  strict_command_detection: { type: boolean }
  context_window_override: { type: ["integer", "null"], minimum: 1 }
  gcp_project_id: { type: ["string", "null"] }
  gemini_credentials_path: { type: ["string", "null"] }
  auto_append_first_prompt_filename: { type: ["string", "null"] }
  disable_health_checks: { type: boolean }
  disable_stale_acp_agent_kills: { type: boolean }
  stale_acp_agent_kill_idle_seconds: { type: number, minimum: 1, maximum: 604800 }
  enable_activity_tracking: { type: boolean }
  request_dedup_window: { type: number, minimum: 0 }
  request_dedup_max_cache: { type: integer, minimum: 1 }
  default_rate_limit: { type: integer, minimum: 0 }
  default_rate_window: { type: integer, minimum: 0 }
  model_defaults: { type: object, additionalProperties: true }
  failover_routes: { type: object, additionalProperties: true }
  identity:
    type: object
    additionalProperties: false
    properties:
      session_id: { type: ["string", "null"] }
      session_turn_count: { type: integer, minimum: 0 }
      title:
        type: object
        additionalProperties: false
        properties:
          mode: { type: string, enum: [default, passthrough, override] }
          override_value: { type: ["string", "null"] }
          default_value: { type: string }
          passthrough_name: { type: string }
      url:
        type: object
        additionalProperties: false
        properties:
          mode: { type: string, enum: [default, passthrough, override] }
          override_value: { type: ["string", "null"] }
          default_value: { type: string }
          passthrough_name: { type: string }
      user_agent:
        type: object
        additionalProperties: false
        properties:
          mode: { type: string, enum: [default, passthrough, override] }
          override_value: { type: ["string", "null"] }
          default_value: { type: string }
          passthrough_name: { type: string }
  empty_response:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: "Whether empty response recovery is enabled"
      max_retries:
        type: integer
        minimum: 0
        description: "Maximum number of retries for empty responses"
      count_reasoning_for_empty_stream:
        type: boolean
        description: >-
          When true, non-empty reasoning/thinking deltas count as meaningful for
          empty-stream detection (avoids false retries when models stream reasoning
          before assistant text). Set false for legacy behavior.
  edit_precision:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: "Master switch for edit-precision tuning"
      temperature:
        type: number
        minimum: 0.0
        maximum: 2.0
        description: "Temperature override for edit-precision mode"
      min_top_p:
        type: ["number", "null"]
        minimum: 0.0
        maximum: 1.0
        description: "Minimum top_p value when override_top_p is true"
      override_top_p:
        type: boolean
        description: "Whether to override top_p in edit-precision mode"
      override_top_k:
        type: boolean
        description: "Whether to override top_k in edit-precision mode"
      target_top_k:
        type: ["integer", "null"]
        minimum: 1
        description: "Target top_k value when override_top_k is true"
      exclude_agents_regex:
        type: ["string", "null"]
        description: "Regex pattern to exclude agents from edit-precision mode"
  rewriting:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: "Whether content rewriting is enabled"
      config_path:
        type: string
        description: "Path to directory containing rewriting configuration files"
  app: { type: ["object", "null"] }
  logging:
    type: object
    additionalProperties: false
    properties:
      level: { type: string, enum: [TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL] }
      request_logging: { type: boolean }
      response_logging: { type: boolean }
      console_stream: { type: string, enum: [stdout, stderr] }
      log_file: { type: ["string", "null"] }
      capture_file: { type: ["string", "null"] }
      capture_max_bytes: { type: ["integer", "null"], minimum: 0 }
      capture_truncate_bytes: { type: ["integer", "null"], minimum: 0 }
      capture_max_files: { type: ["integer", "null"], minimum: 0 }
      capture_rotate_interval_seconds: { type: ["integer", "null"], minimum: 0 }
      capture_total_max_bytes: { type: ["integer", "null"], minimum: 0 }
      capture_buffer_size: { type: ["integer", "null"], minimum: 1024 }
      capture_flush_interval: { type: ["number", "null"], minimum: 0.1 }
      capture_max_entries_per_flush: { type: ["integer", "null"], minimum: 1 }
      cbor_capture_dir: { type: ["string", "null"] }
      cbor_capture_session_id: { type: ["string", "null"] }
      cbor_capture_flush_interval: { type: ["number", "null"], minimum: 0.1 }
      use_colors: { type: boolean }
  auth:
    type: object
    additionalProperties: false
    properties:
      disable_auth: { type: boolean }
      api_keys:
        type: array
        items: { type: string }
      auth_token: { type: ["string", "null"] }
      redact_api_keys_in_prompts: { type: boolean }
      trusted_ips:
        type: array
        items: { type: string }
      brute_force_protection:
        type: object
        additionalProperties: false
        properties:
          enabled: { type: boolean, default: true }
          max_failed_attempts: { type: integer, minimum: 1 }
          ttl_seconds: { type: integer, minimum: 1 }
          initial_block_seconds: { type: integer, minimum: 1 }
          block_multiplier: { type: number, minimum: 1 }
          max_block_seconds: { type: integer, minimum: 1 }
  sso:
    type: ["object", "null"]
    additionalProperties: false
    properties:
      enabled: { type: boolean }
      session_lifetime_hours: { type: integer, minimum: 1 }
      database_path: { type: string }
      providers:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            type: { type: string, enum: [oauth2, saml] }
            client_id: { type: string }
            client_secret: { type: string }
            enabled: { type: boolean }
            discovery_url: { type: ["string", "null"] }
            metadata_url: { type: ["string", "null"] }
            authorize_url: { type: ["string", "null"] }
            token_url: { type: ["string", "null"] }
            userinfo_url: { type: ["string", "null"] }
            scopes:
              type: array
              items: { type: string }
      authorization:
        type: object
        additionalProperties: false
        properties:
          mode: { type: string, enum: [single_user, enterprise] }
          api_url: { type: ["string", "null"] }
          api_timeout: { type: integer, minimum: 1 }
          confirmation_code_expiry_minutes: { type: integer, minimum: 1 }
          max_confirmation_attempts: { type: integer, minimum: 1 }
      captcha:
        type: ["object", "null"]
        additionalProperties: false
        properties:
          enabled: { type: boolean }
          provider: { type: string, enum: [cloudflare_turnstile] }
          site_key: { type: ["string", "null"] }
          secret_key: { type: ["string", "null"] }
          verify_url: { type: string }
          widget_mode: { type: string, enum: [invisible, managed] }
          timeout_seconds: { type: number, minimum: 0 }
  session:
    type: object
    additionalProperties: false
    properties:
      cleanup_enabled: { type: boolean }
      cleanup_interval: { type: integer, minimum: 0 }
      max_age: { type: integer, minimum: 0 }
      default_interactive_mode: { type: boolean }
      force_set_project: { type: boolean }
      project_dir_resolution_model: { type: ["string", "null"] }
      project_dir_resolution_mode: { type: string, enum: ["disabled", "deterministic", "llm", "hybrid"] }
      project_dir_resolution_filesystem_mode: { type: string, enum: ["auto", "enabled", "disabled"] }
      disable_default_openrouter_project_dir_resolution_fallback: { type: boolean }
      disable_interactive_commands: { type: boolean }
      tool_call_repair_enabled: { type: boolean }
      json_repair_enabled: { type: boolean }
      json_repair_strict_mode: { type: boolean }
      json_repair_schema: { type: ["object", "null"] }
      json_repair_buffer_cap_bytes: { type: integer, minimum: 0 }
      tool_call_repair_buffer_cap_bytes: { type: integer, minimum: 0 }
      streaming_sampler:
        type: object
        additionalProperties: false
        properties:
          enabled: { type: boolean }
          sample_rate: { type: number, minimum: 0, maximum: 1 }
          max_samples: { type: integer, minimum: 1 }
      dangerous_command_prevention_enabled: { type: boolean }
      dangerous_command_steering_message: { type: ["string", "null"] }
      pytest_full_suite_steering_enabled: { type: boolean }
      pytest_full_suite_steering_message: { type: ["string", "null"] }
      cat_file_edits_steering_enabled: { type: boolean }
      cat_file_edits_steering_message: { type: ["string", "null"] }
      test_execution_reminder_enabled: { type: boolean }
      test_execution_reminder_message: { type: ["string", "null"] }
      fix_think_tags_enabled: { type: boolean }
      fix_think_tags_streaming_buffer_size: { type: integer, minimum: 1024 }
      droid_path_fix_enabled: { type: boolean }
      double_ampersand_fixes_for_windows_enabled: { type: boolean }
      auto_continue_removal_enabled: { type: boolean }
      streaming_loop_detection_enabled: { type: boolean }
      max_per_session_backends: { type: integer, minimum: 1 }
      session_continuity:
        type: object
        additionalProperties: false
        properties:
          enabled: { type: boolean }
          fingerprint_message_count: { type: integer, minimum: 1 }
          fuzzy_matching: { type: boolean }
          fuzzy_window_sizes: { type: array, items: { type: integer, minimum: 1 } }
          max_session_age_seconds: { type: integer, minimum: 0 }
          client_key_includes_ip: { type: boolean }
          enable_topic_similarity_matching: { type: boolean }
      b2bua:
        type: object
        additionalProperties: false
        properties:
          enabled: { type: boolean }
          continuity_max_age_seconds: { type: integer, minimum: 1 }
          continuity_sliding_expiration: { type: boolean }
          persistent_mapping_store_enabled: { type: boolean }
          echo_enabled: { type: boolean }
          echo_header_name: { type: string, minLength: 1 }
          enable_unsafe_heuristic_session_inference: { type: boolean }
          deployment_mode: { type: string, enum: ["single-process", "multi-worker"] }
      client_compatibility:
        type: object
        additionalProperties: false
        properties:
          reasoning_mode_header: { type: string }
          reasoning_meaningful_header: { type: string }
          user_agent_rules:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
                enabled: { type: boolean }
                user_agent_regex: { type: string, minLength: 1 }
                reasoning_mode:
                  type: string
                  enum: ["passthrough", "coerce_to_content", "drop"]
                reasoning_counts_as_meaningful: { type: boolean }
      planning_phase:
        type: object
        additionalProperties: false
        properties:
          enabled: { type: boolean }
          strong_model: { type: ["string", "null"] }
          max_turns: { type: integer, minimum: 1 }
          max_file_writes: { type: integer, minimum: 0 }
          overrides:
            type: ["object", "null"]
            additionalProperties: false
            properties:
              temperature: { type: ["number", "null"] }
              top_p: { type: ["number", "null"] }
              reasoning_effort: { type: ["string", "null"] }
              thinking_budget: { type: ["integer", "null"], minimum: 0 }
              reasoning: { type: ["object", "null"] }
              generation_config: { type: ["object", "null"] }
      tool_call_reactor:
        type: object
        additionalProperties: true
        properties:
          enabled: { type: boolean }
          unified_steering_enabled: { type: boolean }
          steering_policy_priorities: { type: ["object", "null"] }
          steering_session_ttl_seconds: { type: integer, minimum: 0 }
          steering_max_sessions: { type: integer, minimum: 1 }
          apply_diff_steering_enabled: { type: boolean }
          apply_diff_steering_rate_limit_seconds: { type: integer, minimum: 0 }
          apply_diff_steering_message: { type: ["string", "null"] }
          pytest_full_suite_steering_enabled: { type: boolean }
          pytest_full_suite_steering_message: { type: ["string", "null"] }
          cat_file_edits_steering_enabled: { type: boolean }
          cat_file_edits_steering_message: { type: ["string", "null"] }
          inline_python_steering_enabled: { type: boolean }
          inline_python_steering_message: { type: ["string", "null"] }
          binary_file_edit_steering_enabled: { type: boolean }
          binary_file_edit_steering_message: { type: ["string", "null"] }
          pytest_context_saving_enabled: { type: boolean }
          fix_think_tags_enabled: { type: boolean }
          test_execution_reminder_enabled: { type: boolean }
          test_execution_reminder_message: { type: ["string", "null"] }
          access_policies:
            type: array
            items: { type: object }
          steering_rules:
            type: array
            items: { type: object }
      tool_access_global_overrides: { type: ["object", "null"] }
      force_reprocess_tool_calls: { type: boolean }
      log_skipped_tool_calls: { type: boolean }
      quality_verifier_model:
        type: ["string", "null"]
        description: >
          Model selector for the quality verifier. Supports composite routing (`|` failover, `^` weighted)
          and URI-style parameters (e.g. `model?temperature=0.5`). Mixing `|` and `^` in one selector is rejected.
      quality_verifier_frequency:
        type: integer
        minimum: 1
        default: 1
      quality_verifier_tool_followup_weight:
        type: number
        minimum: 0.0
        maximum: 1.0
        default: 0.2
      quality_verifier_max_history: { type: ["integer", "null"], minimum: 1 }
      quality_verifier_max_consecutive_failures: { type: integer, minimum: 1 }
      quality_verifier_cooldown_seconds: { type: integer, minimum: 0 }
      quality_verifier_ttft_timeout_seconds: { type: number }
      tool_progress_loop_guard_enabled: { type: boolean }
      tool_progress_loop_max_consecutive_followups: { type: integer, minimum: 1 }
      tool_progress_loop_max_repeated_call_signature: { type: integer, minimum: 1 }
      tool_progress_loop_max_repeated_output: { type: integer, minimum: 1 }
      tool_progress_loop_max_counts_per_session: { type: integer, minimum: 1 }
      tool_progress_loop_max_cached_sessions: { type: integer, minimum: 1 }
      tool_progress_loop_action:
        type: string
        enum: [error, steer_then_error]
        default: steer_then_error
      tool_progress_loop_steering_message: { type: ["string", "null"] }
  backends:
    type: object
    additionalProperties: true
    properties:
      default_backend: { type: string }
      static_route:
        type: ["string", "null"]
        description: >
          Optional forced routing selector applied to requests (strict `backend:model`).
          Composite routing syntax is supported (`|`, `^`, `[weight=N]`), and mixing operators is rejected.
      disable_gemini_oauth_fallback: { type: boolean }
      disable_hybrid_backend: { type: boolean }
      hybrid_backend_repeat_messages: { type: boolean }
      reasoning_injection_probability: { type: number, minimum: 0.0, maximum: 1.0 }
      hybrid_reasoning_model_timeout: { type: integer, minimum: 1 }
      hybrid_reasoning_force_initial_turns: { type: integer, minimum: 0 }
      hybrid_execution_model_timeout: { type: integer, minimum: 1 }
      hybrid_reasoning_latency_threshold: { type: number, minimum: 0.0 }
      hybrid_reasoning_backoff_turns: { type: integer, minimum: 0 }
      interleaved_thinking_instructions_file:
        type: ["string", "null"]
        default: "config/prompts/interleaved_thinking/thinker_prompt.md"
        description: "Path to custom instructions injected only into [thinker] routed requests."
      interleaved_thinking_stream_to_client:
        type: boolean
        default: false
        description: "Stream sanitized thinker text to the client before executor output."
      interleaved_thinking_regular_turns_remaining:
        type: integer
        minimum: 0
        default: 2
        description: "Number of subsequent regular executor turns that suppress thinker selection after storing a thinker memo."
      openai_codex:
        type: object
        additionalProperties: true
        properties:
          timeout: { type: integer, minimum: 1 }
          extra:
            type: object
            additionalProperties: true
            properties:
              codex:
                type: object
                additionalProperties: true
                properties:
                  managed_oauth:
                    type: object
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean }
                      storage_path: { type: string, minLength: 1 }
                      accounts:
                        oneOf:
                          - type: string
                            enum: ["all"]
                          - type: array
                            items: { type: string, minLength: 1 }
                      selection_strategy:
                        type: string
                        enum:
                          - round-robin
                          - random
                          - first-available
                          - session-affinity
                      refresh_buffer_seconds: { type: integer, minimum: 0 }
                      session_affinity_ttl_seconds: { type: integer, minimum: 1 }
                      session_affinity_max_entries: { type: integer, minimum: 1 }
                      allow_legacy_fallback: { type: boolean }
                      max_rate_limit_wait_seconds:
                        type: number
                        minimum: 0
                      rate_limit_local_cooldown_cap_seconds:
                        type: number
                        minimum: 0
                      max_rate_limit_idle_polls:
                        type: integer
                        minimum: 1
      openai_codex_v2:
        type: object
        additionalProperties: true
        properties:
          timeout: { type: integer, minimum: 1 }
          extra:
            type: object
            additionalProperties: true
            properties:
              codex:
                type: object
                additionalProperties: true
                properties:
                  managed_oauth:
                    type: object
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean }
                      storage_path: { type: string, minLength: 1 }
                      accounts:
                        oneOf:
                          - type: string
                            enum: ["all"]
                          - type: array
                            items: { type: string, minLength: 1 }
                      selection_strategy:
                        type: string
                        enum:
                          - round-robin
                          - random
                          - first-available
                          - session-affinity
                      refresh_buffer_seconds: { type: integer, minimum: 0 }
                      session_affinity_ttl_seconds: { type: integer, minimum: 1 }
                      session_affinity_max_entries: { type: integer, minimum: 1 }
                      allow_legacy_fallback: { type: boolean }
                      max_rate_limit_wait_seconds:
                        type: number
                        minimum: 0
                      rate_limit_local_cooldown_cap_seconds:
                        type: number
                        minimum: 0
                      max_rate_limit_idle_polls:
                        type: integer
                        minimum: 1
      openai_chatgpt_plan:
        type: object
        additionalProperties: true
        description: >
          Official ChatGPT-plan (openai-chatgpt-plan) backend. Uses Sign in with
          ChatGPT OAuth profiles, not API-key openai/openai-responses credentials.
        properties:
          timeout: { type: integer, minimum: 1 }
          extra:
            type: object
            additionalProperties: true
            properties:
              chatgpt_plan:
                type: object
                additionalProperties: true
                properties:
                  profile_id: { type: ["string", "null"] }
                  profiles_path: { type: string }
                  host_state_path: { type: string }
                  oauth:
                    type: object
                    additionalProperties: false
                    properties:
                      callback_port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        default: 1455
                  model_catalog:
                    type: object
                    additionalProperties: false
                    properties:
                      ttl_seconds:
                        type: integer
                        minimum: 0
                        default: 300
  reasoning_aliases:
    type: object
    additionalProperties: false
    properties:
      reasoning_alias_settings:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [model, modes]
          properties:
            model:
              type: string
            modes:
              type: object
              additionalProperties:
                type: object
                additionalProperties: false
                properties:
                  max_reasoning_tokens: { type: ["integer", "null"], minimum: 0 }
                  reasoning_effort: { type: ["string", "null"] }
                  user_prompt_prefix: { type: ["string", "null"] }
                  user_prompt_suffix: { type: ["string", "null"] }
                  temperature: { type: ["number", "null"], minimum: 0.0, maximum: 2.0 }
                  top_p: { type: ["number", "null"], minimum: 0.0, maximum: 1.0 }
  model_aliases:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        pattern:
          type: string
        replacement:
          type: string
      required: [pattern, replacement]
    default: []
  sandboxing:
    type: object
    additionalProperties: false
    properties:
      enabled: { type: boolean }
      strict_mode: { type: boolean }
      allow_parent_access: { type: boolean }
      custom_tool_patterns:
        type: array
        items: { type: string }
      excluded_tools:
        type: array
        items: { type: string }
      default_tool_patterns:
        type: array
        items: { type: string }
      path_parameter_names:
        type: array
        items: { type: string }
  responses_api:
    type: object
    additionalProperties: false
    properties:
      websocket:
        type: object
        additionalProperties: false
        properties:
          frontend_enabled: { type: boolean }
          backend_enabled: { type: boolean }
          frontend_path: { type: string }
          connection_timeout: { type: integer, minimum: 60, maximum: 7200 }
          max_connections: { type: integer, minimum: 1 }
  replacement:
    type: object
    description: >
      Deprecated random model replacement feature. Prefer composite weighted routing (`^` with optional `[weight=N]`)
      for new setups. When enabled, the proxy uses a compatibility bridge during the deprecation window and emits
      operator-facing deprecation metadata with an `N+1` removal timeline (removed in the release after deprecation).
    additionalProperties: false
    properties:
      enabled: { type: boolean }
      probability: { type: number, minimum: 0.0, maximum: 1.0 }
      replacement_rules:
        type: array
        items:
          type: object
          required: [from_pattern, to_backend, to_model]
          properties:
            from_pattern: { type: string }
            to_backend: { type: string }
            to_model: { type: string }
      backend_model: { type: string }
      turn_count: { type: integer, minimum: 1 }
      allow_oauth_auto_replacement: { type: boolean }
  model_limit_enforcement:
    type: object
    additionalProperties: false
    properties:
      enabled: { type: boolean }
  reasoning_model_token_floor:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: "Whether to enforce minimum output tokens for reasoning-first models"
      models:
        type: object
        additionalProperties: { type: integer, minimum: 1 }
        description: "Model ID (normalized) -> minimum output tokens"
  model_registry:
    type: object
    additionalProperties: false
    properties:
      download_enabled: { type: boolean }
      url: { type: string }
      update_interval_seconds: { type: integer, minimum: 0 }
      cache_path: { type: string }
      bootstrap_path: { type: string }
  vtc_client_patterns:
    type: array
    items: { type: string }
    default: ["cline", "kilo", "roo"]
  health_check:
    type: object
    additionalProperties: false
    properties:
      enabled: { type: boolean }
      circuit_breaker_enabled: { type: boolean }
      notify_backends: { type: boolean }
      log_healthy_checks: { type: boolean }
      ping:
        type: object
        additionalProperties: false
        properties:
          enabled: { type: boolean }
          interval_seconds: { type: number, minimum: 0.1 }
          timeout_seconds: { type: number, minimum: 0.1 }
          failure_threshold: { type: integer, minimum: 1 }
          count: { type: integer, minimum: 1 }
      http:
        type: object
        additionalProperties: false
        properties:
          enabled: { type: boolean }
          interval_seconds: { type: number, minimum: 0.1 }
          timeout_seconds: { type: number, minimum: 0.1 }
          failure_threshold: { type: integer, minimum: 1 }
          method: { type: string, enum: [GET, HEAD] }
          path: { type: string }
          accept_any_response: { type: boolean }
  usage_window_warmup:
    type: object
    additionalProperties: false
    properties:
      enabled: { type: boolean }
      entries:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [model, time]
          properties:
            model: { type: string }
            time:
              type: string
              pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$"
            execute_on_weekend: { type: boolean }
  failure_handling:
    type: object
    additionalProperties: false
    properties:
      enabled: { type: boolean }
