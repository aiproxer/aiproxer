# NO-KEY LOCAL STUB — exercises opt-in tool-name correction (issue #997).
# local-stub proves the opt-in wiring loads; it streams assistant text before its
# tool call, so the correction rails deliver that call unchanged. Point the route
# at a tool-only model response to exercise an actual correction.
# Not a live-provider configuration.
server:
  address: "127.0.0.1:18089"

routing:
  max_attempts: 3
  default_route: "dogfood-local:stub-default"

continuity:
  in_memory: true
  store: memory

logging:
  level: info
  format: text

diagnostics:
  enabled: false

hooks:
  tool_reactor_error_policy: fail_open

plugins:
  frontends:
    - id: openai-responses
      enabled: true
      config: {}
    - id: openai-legacy
      enabled: true
      config: {}
    - id: anthropic
      enabled: true
      config: {}
    - id: gemini
      enabled: true
      config: {}
  backends:
    - id: openai-responses
      enabled: false
      config: {}
    - id: openai-legacy
      enabled: false
      config: {}
    - id: anthropic
      enabled: false
      config: {}
    - id: gemini
      enabled: false
      config: {}
    - id: bedrock
      enabled: false
      config: {}
    - id: acp
      enabled: false
      config: {}
    - id: openrouter
      enabled: false
      config: {}
    - id: nvidia
      enabled: false
      config: {}
    - id: opencode-go
      enabled: false
      config: {}
    - id: opencode-zen
      enabled: false
      config: {}
    - id: ollama
      enabled: false
      config: {}
    - id: ollama-cloud
      enabled: false
      config: {}
    - id: llamacpp
      enabled: false
      config: {}
    - id: lmstudio
      enabled: false
      config: {}
    - id: vllm
      enabled: false
      config: {}
    - kind: local-stub
      id: dogfood-local
      enabled: true
      config:
        text: "[dogfood] tool-name correction"
        tool_name: get_weather
        tool_args: '{"location":"NYC"}'
        input_tokens: 3
        output_tokens: 7
  features:
    - id: submit-noop
      enabled: true
      config: {}
    - id: parts-noop
      enabled: true
      config: {}
    - id: tool-reactor-noop
      enabled: true
      config: {}
    # Runs at order 40; tool-name-correction runs after it at 45, so a near-miss
    # name repair normalizes is never treated as invalid. Setting this order above
    # 45 means near-miss names are corrected instead of repaired: still safe, just
    # costlier, because the call is replaced by a hidden follow-up attempt.
    - id: tool-call-repair
      enabled: true
      config: {}
    - id: tool-name-correction
      enabled: true            # opt-in; absent or false = feature off
      config:
        max_corrections_per_turn: 1   # [1,3], default 1
        correct_after_reasoning: true # default true
        pass_through_names: []        # path.Match globs, e.g. ["mcp__*"], max 32
