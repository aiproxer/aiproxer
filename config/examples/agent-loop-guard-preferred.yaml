# NO-KEY LOCAL STUB — Agent Loop Guard with the RECOMMENDED explicit strategy.
# Operator guide: docs/agent-loop-guard.md
#
# `strategy: attempt_completion` is the explicit, recommended form for new ALG
# deployments. Omitting `strategy` would keep the pre-spec `semantic_verifier`
# behavior instead, which is a compatibility default, not a recommendation.
#
# The local stub advertises callable tools only because `tool_name` is set, and it
# emits exactly one `attempt_completion` call per turn: the completion signal the
# protocol expects. The injected tool and its instruction stay backend-visible
# only — a client declaring its own `attempt_completion` would make activation
# ineligible instead.
#
# `max_protocol_reprompts` (default 1, V1 accepts 1..3) bounds the hidden
# protocol-repair continuations after a clean stop with no completion signal.
# `no_progress_limit` is the shared bounded breaker for both strategies.
#
# Not a live-provider configuration.
# Validate: aipstd check-config --config config/examples/agent-loop-guard-preferred.yaml
# This file loads and its routes inspect cleanly, but `aipstd serve` refuses to
# start it: the `local-stub` backend has no registered security profile. Point
# `backends` at a real provider with a registered profile before serving.
server:
  address: "127.0.0.1:18086"

routing:
  max_attempts: 3
  default_route: "alg-preferred-local:stub-default"

continuity:
  in_memory: true
  store: memory

logging:
  level: info
  format: text

diagnostics:
  enabled: false

hooks:
  tool_reactor_error_policy: fail_open

plugins:
  frontends:
    - id: openai-responses
      enabled: true
      config: {}
    - id: openai-legacy
      enabled: true
      config: {}
    - id: anthropic
      enabled: true
      config: {}
    - id: gemini
      enabled: true
      config: {}
  backends:
    - id: openai-responses
      enabled: false
      config: {}
    - id: openai-legacy
      enabled: false
      config: {}
    - id: anthropic
      enabled: false
      config: {}
    - id: gemini
      enabled: false
      config: {}
    - id: bedrock
      enabled: false
      config: {}
    - id: acp
      enabled: false
      config: {}
    - id: openrouter
      enabled: false
      config: {}
    - id: nvidia
      enabled: false
      config: {}
    - id: opencode-go
      enabled: false
      config: {}
    - id: opencode-zen
      enabled: false
      config: {}
    - id: ollama
      enabled: false
      config: {}
    - id: ollama-cloud
      enabled: false
      config: {}
    - id: llamacpp
      enabled: false
      config: {}
    - id: lmstudio
      enabled: false
      config: {}
    - id: vllm
      enabled: false
      config: {}
    - kind: local-stub
      id: alg-preferred-local
      enabled: true
      config:
        text: "[agent-loop-guard/attempt_completion] local stub"
        input_tokens: 1
        output_tokens: 1
        tool_name: attempt_completion
        tool_args: '{"result":"stub task complete"}'
  features:
    - id: submit-noop
      enabled: true
      config: {}
    - id: parts-noop
      enabled: true
      config: {}
    - id: tool-reactor-noop
      enabled: true
      config: {}
    - id: agent-loop-guard
      enabled: true
      config:
        strategy: attempt_completion
        max_protocol_reprompts: 1
        no_progress_limit: 2