# Operator: rollback by pointing discovery at the previous published plugin root.
# No aipstd rebuild. See docs/backend-plugins/operator.md.
server:
  address: "127.0.0.1:18183"

routing:
  max_attempts: 3
  default_route: "op-rb:stub-default"

continuity:
  in_memory: true
  store: memory

logging:
  level: info
  format: text

diagnostics:
  enabled: false

hooks:
  tool_reactor_error_policy: fail_open

plugins:
  backend_discovery:
    enabled: true
    development_mode: true
    strict: true
    paths:
      - .aip-plugins/previous/localstub
  frontends:
    - id: openai-responses
      enabled: true
      config: {}
    - id: openai-legacy
      enabled: true
      config: {}
    - id: anthropic
      enabled: true
      config: {}
    - id: gemini
      enabled: true
      config: {}
  backends:
    - id: openai-responses
      enabled: false
      config: {}
    - id: openai-legacy
      enabled: false
      config: {}
    - id: anthropic
      enabled: false
      config: {}
    - id: gemini
      enabled: false
      config: {}
    - id: bedrock
      enabled: false
      config: {}
    - kind: local-stub
      id: op-rb
      enabled: true
      config:
        text: "[operator] rollback previous"
        input_tokens: 1
        output_tokens: 1
  features:
    - id: submit-noop
      enabled: true
      config: {}
    - id: parts-noop
      enabled: true
      config: {}
    - id: tool-reactor-noop
      enabled: true
      config: {}
