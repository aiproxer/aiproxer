# NO-KEY LOCAL STUB DOGFOOD — external connectors/localstub executable plugin.
# Stage the plugin first: make package-full PACKAGE_DEST=.aip-plugins
# (or go run ./tools/backendplugin/package_plugins -profile full -dest .aip-plugins/full
# and point backend_discovery.paths at that tree's localstub parent).
#
# Default route: dogfood-local backend, model stub-default.
server:
  address: "127.0.0.1:18080"

routing:
  max_attempts: 3
  default_route: "dogfood-local:stub-default"

continuity:
  in_memory: true
  store: memory

logging:
  level: info
  format: text

diagnostics:
  enabled: false

hooks:
  tool_reactor_error_policy: fail_open

plugins:
  backend_discovery:
    enabled: true
    development_mode: true
    paths:
      - .aip-plugins/full/localstub
  frontends:
    - id: openai-responses
      enabled: true
      config: {}
    - id: openai-legacy
      enabled: true
      config: {}
    - id: anthropic
      enabled: true
      config: {}
    - id: gemini
      enabled: true
      config: {}
  backends:
    - id: openai-responses
      enabled: false
      config: {}
    - id: openai-legacy
      enabled: false
      config: {}
    - id: anthropic
      enabled: false
      config: {}
    - id: gemini
      enabled: false
      config: {}
    - id: bedrock
      enabled: false
      config: {}
    - id: acp
      enabled: false
      config: {}
    - id: openrouter
      enabled: false
      config: {}
    - id: nvidia
      enabled: false
      config: {}
    - id: opencode-go
      enabled: false
      config: {}
    - id: opencode-zen
      enabled: false
      config: {}
    - id: ollama
      enabled: false
      config: {}
    - id: ollama-cloud
      enabled: false
      config: {}
    - id: llamacpp
      enabled: false
      config: {}
    - id: lmstudio
      enabled: false
      config: {}
    - id: vllm
      enabled: false
      config: {}
    - kind: local-stub
      id: dogfood-local
      enabled: true
      config:
        text: "[dogfood] local stub"
        input_tokens: 3
        output_tokens: 7
  features:
    - id: submit-noop
      enabled: true
      config: {}
    - id: parts-noop
      enabled: true
      config: {}
    - id: tool-reactor-noop
      enabled: true
      config: {}
    - id: tool-call-repair
      enabled: true
      config: {}
    # Compaction continuity is intentionally disabled in the no-key dogfood
    # path. See docs/compaction-continuity.md before enabling remote extraction.
    - id: compaction-continuity
      enabled: false
      config:
        extractor:
          route: "openai-responses:small-model"
          timeout: 8s
          max_input_tokens: 12000
          max_output_tokens: 2000
        worker:
          max_concurrency: 2
          queue_capacity: 16
        barrier:
          timeout: 2s
        capsule:
          max_tokens: 2500
          max_bytes: 1048576
        source:
          ttl: 2h
          max_bytes: 4194304
        result:
          ttl: 2h
          max_bytes: 4194304
          max_count: 16
        failure:
          mode: fail_open
        branch_ttl: 2h
        max_branch_entries: 1024
