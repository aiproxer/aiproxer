# NO-KEY LOCAL STUB — secrets-guard action: redact (single_user).
# Replaces matched secret spans in the canonical call (UTF-8 byte length preserved)
# before metering checkpoint, traffic capture, or backend dispatch. JSON string values are redacted normally; matches outside string values must fail closed rather than rewrite JSON syntax. Operator guide: docs/secrets-guard.md
# Operator guide: docs/secrets-guard.md
#
# Start: aipstd serve --config config/examples/secrets-guard-redact-single-user.yaml
server:
  address: "127.0.0.1:18083"

routing:
  max_attempts: 3
  default_route: "sg-redact-local:stub-default"

continuity:
  in_memory: true
  store: memory

logging:
  level: info
  format: text

diagnostics:
  enabled: false

hooks:
  tool_reactor_error_policy: fail_open

plugins:
  frontends:
    - id: openai-responses
      enabled: true
      config: {}
    - id: openai-legacy
      enabled: true
      config: {}
    - id: anthropic
      enabled: true
      config: {}
    - id: gemini
      enabled: true
      config: {}
  backends:
    - id: openai-responses
      enabled: false
      config: {}
    - id: openai-legacy
      enabled: false
      config: {}
    - id: anthropic
      enabled: false
      config: {}
    - id: gemini
      enabled: false
      config: {}
    - id: bedrock
      enabled: false
      config: {}
    - id: acp
      enabled: false
      config: {}
    - id: openrouter
      enabled: false
      config: {}
    - id: nvidia
      enabled: false
      config: {}
    - id: opencode-go
      enabled: false
      config: {}
    - id: opencode-zen
      enabled: false
      config: {}
    - id: ollama
      enabled: false
      config: {}
    - id: ollama-cloud
      enabled: false
      config: {}
    - id: llamacpp
      enabled: false
      config: {}
    - id: lmstudio
      enabled: false
      config: {}
    - id: vllm
      enabled: false
      config: {}
    - kind: local-stub
      id: sg-redact-local
      enabled: true
      config:
        text: "[secrets-guard redact] local stub"
        input_tokens: 1
        output_tokens: 1
  features:
    - id: submit-noop
      enabled: true
      config: {}
    - id: parts-noop
      enabled: true
      config: {}
    - id: tool-reactor-noop
      enabled: true
      config: {}
    - id: secrets-guard
      enabled: true
      config:
        action: redact
        single_user:
          include_popular_env: true
          include_env: []
          exclude_env: []
        redaction:
          mask_byte: "*"
          preserve_known_prefixes: true
