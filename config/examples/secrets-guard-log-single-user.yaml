# NO-KEY LOCAL STUB — secrets-guard action: log (single_user).
# Detects loaded secret values in model-bound fields, emits secret-safe audit events,
# and forwards the canonical call unchanged. Because ingress stays unchanged, downstream response capture can still observe a model echo. Operator guide: docs/secrets-guard.md
#
# Start: aipstd serve --config config/examples/secrets-guard-log-single-user.yaml
server:
  address: "127.0.0.1:18082"

routing:
  max_attempts: 3
  default_route: "sg-log-local:stub-default"

continuity:
  in_memory: true
  store: memory

logging:
  level: info
  format: text

diagnostics:
  enabled: false

hooks:
  tool_reactor_error_policy: fail_open

plugins:
  frontends:
    - id: openai-responses
      enabled: true
      config: {}
    - id: openai-legacy
      enabled: true
      config: {}
    - id: anthropic
      enabled: true
      config: {}
    - id: gemini
      enabled: true
      config: {}
  backends:
    - id: openai-responses
      enabled: false
      config: {}
    - id: openai-legacy
      enabled: false
      config: {}
    - id: anthropic
      enabled: false
      config: {}
    - id: gemini
      enabled: false
      config: {}
    - id: bedrock
      enabled: false
      config: {}
    - id: acp
      enabled: false
      config: {}
    - id: openrouter
      enabled: false
      config: {}
    - id: nvidia
      enabled: false
      config: {}
    - id: opencode-go
      enabled: false
      config: {}
    - id: opencode-zen
      enabled: false
      config: {}
    - id: ollama
      enabled: false
      config: {}
    - id: ollama-cloud
      enabled: false
      config: {}
    - id: llamacpp
      enabled: false
      config: {}
    - id: lmstudio
      enabled: false
      config: {}
    - id: vllm
      enabled: false
      config: {}
    - kind: local-stub
      id: sg-log-local
      enabled: true
      config:
        text: "[secrets-guard log] local stub"
        input_tokens: 1
        output_tokens: 1
  features:
    - id: submit-noop
      enabled: true
      config: {}
    - id: parts-noop
      enabled: true
      config: {}
    - id: tool-reactor-noop
      enabled: true
      config: {}
    - id: secrets-guard
      enabled: true
      config:
        action: log
        audit_failure_policy: best_effort
        single_user:
          include_popular_env: true
          include_env: []
          exclude_env: []
