# NO-KEY LOCAL STUB — session-classification, explicit remote (Jev hybrid) mode.
# Remote classification is OFF unless explicitly configured. This example enables it:
# decisive local evidence promotes first, and only sessions still unknown after local
# evaluation claim a lease and make one bounded remote decision.
#
# NO CREDENTIAL IS STORED IN THIS FILE. `api_key_env` is the NAME of an environment
# variable; the adapter resolves the value from the process environment at call time and
# never stores, echoes, or returns it. Export the credential yourself before serving:
#
#   export TYPESAFE_API_KEY=...   # your own value, never committed
#
# Operator guide: docs/session-classification.md
#
# Start: aipstd serve --config config/examples/session-classification-remote-jev.yaml
server:
  address: "127.0.0.1:18088"

routing:
  max_attempts: 3
  default_route: "sc-jev:stub-default"

continuity:
  in_memory: true
  store: memory

logging:
  level: info
  format: text

diagnostics:
  enabled: false

hooks:
  tool_reactor_error_policy: fail_open

plugins:
  frontends:
    - id: openai-responses
      enabled: true
      config: {}
    - id: openai-legacy
      enabled: true
      config: {}
    - id: anthropic
      enabled: true
      config: {}
    - id: gemini
      enabled: true
      config: {}
  backends:
    - id: openai-responses
      enabled: false
      config: {}
    - id: openai-legacy
      enabled: false
      config: {}
    - id: anthropic
      enabled: false
      config: {}
    - id: gemini
      enabled: false
      config: {}
    - kind: local-stub
      id: sc-jev
      enabled: true
      config:
        text: "[session-classification] remote jev hybrid mode"
        input_tokens: 1
        output_tokens: 1
  features:
    - id: submit-noop
      enabled: true
      config: {}
    - id: parts-noop
      enabled: true
      config: {}
    - id: tool-reactor-noop
      enabled: true
      config: {}
    # Every remote field is required explicitly: there are no measured defaults, and an
    # incomplete remote block fails the candidate generation before publication.
    # `mode: jev` would promote only from the remote decision; `hybrid` promotes on
    # decisive local evidence first and reserves the remote call for ambiguous sessions.
    - id: session-classification
      enabled: true
      config:
        mode: hybrid
        heuristic:
          ignored_user_agent_prefixes: []
        remote:
          # The only supported provider in V1.
          provider: jev
          # Credential REFERENCE (environment-variable name), never a credential value.
          api_key_env: TYPESAFE_API_KEY
          # Hard per-attempt timeout over the whole exchange: >= 1ms, <= 30s.
          timeout: 750ms
          # Finite per-session attempt budget: 1..5.
          max_attempts_per_session: 1
          # Lease lifetime: <= 2m AND strictly greater than timeout + 100ms.
          lease_ttl: 2s
          # Delay between two attempts of one turn: 0..30s.
          retry_backoff: 0s
          # The only threshold input for a remote promotion: > 0 and <= 1.
          positive_threshold: 0.90