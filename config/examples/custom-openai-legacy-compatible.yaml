# Built-in OpenAI Chat Completions compatible backend (env-root credentials).
# Validate: go run ./cmd/aipstd check-config --config config/examples/custom-openai-legacy-compatible.yaml
server:
  address: "127.0.0.1:18090"

routing:
  max_attempts: 3
  default_route: "provider123:provider123/model-a"

continuity:
  in_memory: true
  store: memory

logging:
  level: info
  format: text

diagnostics:
  enabled: false

hooks:
  tool_reactor_error_policy: fail_open

plugins:
  frontends:
    - id: openai-legacy
      enabled: true
      config: {}
  backends:
    - id: provider123
      kind: custom-openai-legacy-compatible
      enabled: true
      config:
        backend_prefix: provider123
        base_url: https://api.provider123.example/v1
        api_key_env_var_root: PROVIDER123_API_KEY
        tokenizer: cl100k_base
        max_concurrent_requests: 4
        models:
          source: inline
          items:
            - canonical_id: provider123/model-a
              native_id: model-a
              display_name: Provider123 Model A
  features:
    - id: submit-noop
      enabled: true
      config: {}
