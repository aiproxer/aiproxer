# NO-KEY LOCAL STUB — session-classification, default (deterministic heuristic) mode.
# Classifies a logical session as coding_agent from bounded local evidence only:
# accepted client identity, canonical tool categories, and a bounded workspace-marker window.
# Makes no external call and references no credential. Classification is advisory derived
# metadata: it is not authorization and it does not gate any existing feature.
# Operator guide: docs/session-classification.md
#
# Start: aipstd serve --config config/examples/session-classification-heuristic.yaml
server:
  address: "127.0.0.1:18087"

routing:
  max_attempts: 3
  default_route: "sc-heuristic:stub-default"

continuity:
  in_memory: true
  store: memory

logging:
  level: info
  format: text

diagnostics:
  enabled: false

hooks:
  tool_reactor_error_policy: fail_open

plugins:
  frontends:
    - id: openai-responses
      enabled: true
      config: {}
    - id: openai-legacy
      enabled: true
      config: {}
    - id: anthropic
      enabled: true
      config: {}
    - id: gemini
      enabled: true
      config: {}
  backends:
    - id: openai-responses
      enabled: false
      config: {}
    - id: openai-legacy
      enabled: false
      config: {}
    - id: anthropic
      enabled: false
      config: {}
    - id: gemini
      enabled: false
      config: {}
    - kind: local-stub
      id: sc-heuristic
      enabled: true
      config:
        text: "[session-classification] deterministic heuristic mode"
        input_tokens: 1
        output_tokens: 1
  features:
    - id: submit-noop
      enabled: true
      config: {}
    - id: parts-noop
      enabled: true
      config: {}
    - id: tool-reactor-noop
      enabled: true
      config: {}
    # Default mode is heuristic even when `mode` is omitted; it is spelled out here
    # so the published posture is explicit. A remote block is not allowed in this mode.
    - id: session-classification
      enabled: true
      config:
        mode: heuristic
        # Optional bounded literal client-identity prefixes that suppress Rule A only.
        # They never withdraw the tool-cluster rules and never revoke an existing positive.
        # At most 16 entries, at most 128 bytes each; matching is case-insensitive and
        # literal (no regular expressions).
        heuristic:
          ignored_user_agent_prefixes: []