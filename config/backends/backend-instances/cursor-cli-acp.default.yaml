# Optional Cursor CLI ACP backend instance (local Cursor subscription / login).
# Prerequisites: install Cursor CLI so `agent` is on PATH (Windows: typically
# %LOCALAPPDATA%\cursor-agent\agent.cmd). Run `agent login` once for cookie auth.
# Dual auth: ACP prefers local login cookies. Discovery may use CURSOR_API_KEY
# or the apiKey from Cursor's auth.json login store when `agent --list-models`
# rejects cookie-only auth (common on recent CLI builds). ACP children still
# strip inherited CURSOR_API_KEY when cookie login is usable. Multi User Mode:
# this connector is OAuth-style and is not loaded in production multi-user.
connector: cursor-cli-acp
extra:
  # Optional default workspace when a request/session does not name one.
  # Distinct session/request directories spawn separate ACP children
  # (same pooling as other ACP connectors). Relative paths are rejected.
  # workspace_path: "C:\\absolute\\trusted\\project"
  model: "composer-2"
  # Responses compatibility is text-only: Cursor-owned tool permissions are
  # always rejected and this backend must not be used as a Codex Executor.
  auto_accept: false
  # API model examples: cursor-cli-acp:cursor/grok-4.6-high (standard) or
  # cursor-cli-acp:cursor/grok-4.6-high-fast (fast). Composer 2.5 uses the
  # same base/-fast suffix pair. Do not append [fast=false] to an API slug.
  # The connector selects fast=false or fast=true through ACP before the first
  # prompt and verifies the effective value.
  # ACP is headless and cannot show Cursor's interactive trust prompt.
  # Pass --trust so each spawned child can use its target directory the same
  # way an already-trusted interactive `agent` session would.
  trust_workspace: true
  process_timeout: 300
  idle_timeout: 120
  # Seconds to reuse `agent --list-models` output before re-running subprocess (0 = always refresh).
  cursor_models_cache_ttl_seconds: 3600
  mcp_servers: []
  # cursor_cli_executable: "C:\\Users\\YOU\\AppData\\Local\\cursor-agent\\agent.cmd"
  # Applied consistently to both `agent --list-models` discovery and the ACP process.
  # cursor_api_endpoint: "https://api.cursor.sh"
  # Optional arguments are passed unchanged to both commands (for example,
  # profile or endpoint-selection flags required by a local Cursor install).
  # cursor_cli_extra_args: []
  # Discovery subprocess deadline in seconds (default: 60).
  # cursor_model_discovery_timeout_seconds: 60
