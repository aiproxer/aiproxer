    # Custom compatible backends are built-in protocol aliases (origin: built_in_compatible).
    # See docs/custom-compatible-backends.md. Literal api_key/api_keys/credentials in YAML are rejected.
    # Use kind to select the generic factory; id remains the runtime route backend instance.
    # backend_prefix must be unique, cannot contain / or :, and cannot collide with built-in or discovered prefixes.
    # api_key_env_var_root reads ROOT, ROOT_2, ROOT_3, ... Omit for no-auth endpoints.
    # Optional: tokenizer (cl100k_base|o200k_base), max_concurrent_requests, models (inline|file).
    # - id: provider123
    #   kind: custom-openai-legacy-compatible
    #   enabled: false
    #   config:
    #     backend_prefix: provider123
    #     base_url: https://api.provider123.example/v1
    #     api_key_env_var_root: PROVIDER123_API_KEY
    # - id: provider123-responses
    #   kind: custom-openai-responses-compatible
    #   enabled: false
    #   config:
    #     backend_prefix: provider123-responses
    #     base_url: https://api.provider123.example/v1
    #     api_key_env_var_root: PROVIDER123_RESPONSES_API_KEY
    # - id: provider-anthropic
    #   kind: custom-anthropic-compatible
    #   enabled: false
    #   config:
    #     backend_prefix: provider-anthropic
    #     base_url: https://api.provider-anthropic.example
    #     api_key_env_var_root: PROVIDER_ANTHROPIC_API_KEY
  features:
    - id: submit-noop
      enabled: true
      config: {}
    - id: parts-noop
      enabled: true
      config: {}
    - id: tool-reactor-noop
      enabled: true
      config: {}
    # Canonical tool-call repair (ADR 0007): enabled by default when omitted from
    # standard aipstd configs. Explicit enabled row documents defaults; set
    # enabled: false to opt out (suppresses injection/enablement).
    - id: tool-call-repair
      enabled: true
      config:
        mode: conservative
        max_args_bytes: 65536
        on_unrepairable: pass_through
    # Opt out:
    # - id: tool-call-repair
    #   enabled: false
    #
    # Reasoning output preservation (issue #157): on standard aipstd /
    # runtimebundle.BuildBootstrap, an enabled restore row is injected when no
    # matching features row exists (same pattern as tool-call-repair). Explicit
    # enabled row below documents the exact injected defaults. Set enabled: false
    # (or omit enabled — plain bool defaults false) to opt out; any matching
    # instance id or factory kind suppresses injection. Disabled constructs no
    # participants/store/telemetry. Installed/enabled does not mean universally
    # active: capture and restore require a compatible-auto.v2 catalog match or
    # an explicit enabled rule; unmatched candidates are inert. Not a mandatory
    # StandardDistributionRequirements entry (custom roots are not injected).
    # Operator guide: docs/reasoning-output-preservation.md
    - id: reasoning-output-preservation
      enabled: true
      config:
        action: restore
        use_builtin_catalog: true
        on_ambiguous: log_skip
        on_unrepresentable: reject
        on_state_error: reject
        state:
          ttl: 24h
          max_turns_per_session: 16
          max_reasoning_bytes_per_turn: 65536
          max_session_bytes: 262144
    # Opt out:
    # - id: reasoning-output-preservation
    #   enabled: false
    # Reference (non-noop) examples — enable as needed:
    # - id: ref-submit-annotate
    #   enabled: true
    #   config: { marker: "staging" }
    # - id: ref-request-suffix
    #   enabled: true
    #   config: { suffix: " [ref]" }
    # - id: ref-tool-prefix
    #   enabled: true
    #   config: { prefix: ">>" }
    #
    # Secrets guard (issue #151) — ingress secret detection; disabled by default.
    # Operator guide: docs/secrets-guard.md. Runnable examples: config/examples/secrets-guard-*.yaml
    # Only one enabled secrets-guard feature instance is supported in v1; multiple enabled
    # registrations must fail startup. Staged rollout is one action per deployment: disabled -> log -> redact -> block.
    # - id: secrets-guard
    #   enabled: false
    #   config:
    #     action: block                  # required when enabled: block | redact | log
    #     audit_failure_policy: fail_closed  # fail_closed | best_effort
    #     min_secret_bytes: 8
    #     scan_max_bytes: 2097152        # default 2 MiB per scanned field; max 67108864 (64 MiB)
    #     single_user:                   # invalid under access.mode: multi_user (omit in multi-user)
    #       include_popular_env: true    # exact popular names + uppercase *_API_KEY/*_TOKEN (excl. NEXT_PUBLIC_/VITE_/… and CSRF/XSRF/CRSF segments)
    #       include_env: []              # extra env var names to load at startup
    #       exclude_env: []              # names to drop from the single-user catalog
    #     redaction:
    #       mask_byte: "*"               # single ASCII byte; used when action: redact
    #       preserve_known_prefixes: true  # keep declared public prefixes (sk-, ghp_, …) during redact
    #     # single_user catalog is a startup snapshot; credential rotation requires restarting all replicas.
    #     # log mode leaves ingress unchanged, so downstream response capture may still see a model echo.
    #
    # Agent Loop Guard — disabled by default (no row means no ALG terminal-decision provider).
    # Operator guide: docs/agent-loop-guard.md. Loadable credential-free examples:
    # config/examples/agent-loop-guard-preferred.yaml and
    # config/examples/agent-loop-guard-legacy-verifier.yaml
    #
    # RECOMMENDED for new deployments: spell the strategy out explicitly. Two mutually
    # exclusive strategies, never hybrid, no automatic fallback between them.
    # - id: agent-loop-guard
    #   enabled: true
    #   config:
    #     strategy: attempt_completion    # recommended: worker self-attests via a
    #                                      # proxy-injected attempt_completion tool;
    #                                      # no auxiliary model call on the normal path
    #     max_protocol_reprompts: 1       # default 1; V1 accepts 1..3, integer only
    #     no_progress_limit: 2            # shared bounded breaker, default 2, max 64
    #
    # Omitting `strategy` keeps the pre-spec semantic_verifier behavior for backward
    # compatibility. That is a compatibility default, NOT a recommendation. The legacy
    # row below is behaviorally identical to omitting the key and exists to make the
    # current intent explicit:
    # - id: agent-loop-guard
    #   enabled: true
    #   config:
    #     strategy: semantic_verifier
    #     verifier_role: loop_guard           # max 128 chars
    #     verifier_timeout_seconds: 4        # 1..300
    #     max_semantic_continuations: 3      # 1..64
    #     no_progress_limit: 2               # shared bounded breaker
    #     explicit_completion_policy: trust  # trust | verify; verify makes the verifier
    #                                        # the authority even for an explicit completion
    #
    # Mutual exclusion is by YAML key PRESENCE, not by post-default value: the four
    # verifier-only keys above are rejected under strategy: attempt_completion, and
    # max_protocol_reprompts is rejected under strategy: semantic_verifier, whatever the
    # value. For an ENABLED row such a configuration fails generation compile
    # (aipstd serve refuses to start).
    #
    # A row with `enabled: false` is NOT compiled: the row is skipped before the factory
    # is ever called, so its whole config block is never decoded and NOT validated at all.
    # No rule in this block applies to it -- not mutual exclusion, not unknown keys, not
    # ranges. Do not pre-stage an unvalidated config behind `enabled: false`: write the
    # block with `enabled: true`, validate it by starting aipstd serve (or applying the
    # reload), and only then disable the row. Note also that aipstd check-config reports a
    # feature bundle error only as a WARN while still printing "configuration is valid".
    #
    # attempt_completion activates only on a tools-capable backend whose client tool choice
    # is unset or auto, with no named tool and no allowed-tools subset. Ineligibility is
    # not an error, is never emulated through prose, and never falls back to the verifier.
    #
    # Compaction continuity preservation (issue #312 detector prerequisite) is
    # disabled by default. It may submit additional user-attributed extractor
    # inference after a successfully opened primary request. See
    # docs/compaction-continuity.md and config/examples/dogfood-local-stub.yaml.
    # - id: compaction-continuity
    #   enabled: false
    #   config:
    #     preserve:
    #       plan: true
    #       user_decisions: true
    #       constraints: true
    #       rationale: true
    #       rejected_alternatives: true
    #     extractor:
    #       route: "openai-responses:small-model" # independent backend:model selector
    #       timeout: 8s
    #       max_input_tokens: 12000
    #       max_output_tokens: 2000
    #     worker:
    #       max_concurrency: 2
    #       queue_capacity: 16
    #     barrier:
    #       timeout: 2s
    #     capsule:
    #       max_tokens: 2500
    #       max_bytes: 1048576
    #     source:
    #       ttl: 2h
    #       max_bytes: 4194304
    #     result:
    #       ttl: 2h
    #       max_bytes: 4194304
    #       max_count: 16
    #     failure:
    #       mode: fail_open
    #     branch_ttl: 2h
    #     max_branch_entries: 1024
    #
    # Proxy-side Codex memory (proxy-codex-memory): per-user session capture,
    # background extraction/consolidation and first-turn summary injection.
    # Disabled by default; enable only with a durable continuity DB and per-user
    # API-key principals (never list a shared key).
    - id: proxy-memory
      enabled: false
      config:
        principals: ["alice", "bob"]   # per-user API-key principal IDs; never list a shared key
        extract_route: "openai:gpt-5-mini"
        consolidate_route: "openai:gpt-5"
