version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - govet
    - gosec
    - nilerr
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    paths:
      - vendor$
      - third_party$

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - vendor$
      - third_party$
