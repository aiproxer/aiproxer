name: CodeQL

# CodeQL analysis is disabled: it produced noise and no actionable findings.
# The `Analyze (Go)` job is kept as an instant no-op only so a required status
# check of that name keeps reporting success on pull requests. Delete this file
# together with the branch-protection entry to remove it entirely.
on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CodeQL disabled
        run: echo "CodeQL analysis is disabled for this repository."
