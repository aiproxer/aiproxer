name: SecretGuard contracts

on:
  pull_request:
    # labeled/unlabeled so applying or removing the exemption re-runs the parity
    # lane, which includes the changed-Go-file archtest gate.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - '.github/workflows/secret-guard-contracts.yml'
      - 'pkg/aipsdk/secretguard/**'
      - 'internal/plugins/features/secretguard/**'
      - 'internal/stdhttp/auth/**'
      - 'internal/standardplugins/featurehost/secretguard/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/secret-guard-contracts.yml'
      - 'pkg/aipsdk/secretguard/**'
      - 'internal/plugins/features/secretguard/**'
      - 'internal/stdhttp/auth/**'
      - 'internal/standardplugins/featurehost/secretguard/**'
  workflow_dispatch:
  # Race detector and canonical parity run nightly; PRs run the fast contracts.
  schedule:
    - cron: "32 4 * * *"

permissions:
  contents: read

# The oversized-PR exemption is label-driven, so every workflow that can run a
# gate that counts changed Go files must resolve it the same way. Omitting it here
# made this workflow the one place a deliberately oversized PR still failed
# TestConversationViewChangedGoFileCountUnderGate, because the test honors
# AIP_ALLOW_LARGE_CHANGE but nothing in this workflow set it.
env:
  AIP_ALLOW_LARGE_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-large-change') && '1' || '' }}

concurrency:
  # Nightly schedule / manual runs get their own group so a main push cannot
  # cancel the race and parity evidence mid-run; only superseded PR runs are
  # cancelled (see ci.yml for the same rule).
  group: secretguard-${{ github.head_ref || github.ref_name }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-scheduled' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: SecretGuard Linux race and streaming contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore shared Go cache
        uses: ./.github/actions/go-cache
        with:
          lane: race

      - name: Record tested revision
        shell: bash
        run: |
          mkdir -p .tmp/secretguard-contracts
          git rev-parse HEAD > .tmp/secretguard-contracts/revision.txt

      - name: Fast streaming contracts (no race detector)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=8m \
            ./internal/plugins/features/secretguard/... \
            ./internal/stdhttp/auth \
            ./internal/standardplugins/featurehost/secretguard \
            ./pkg/aipsdk/secretguard \
            2>&1 | tee .tmp/secretguard-contracts/fast.log

      - name: Race and incremental streaming contracts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          # The secretguard race package alone measures 378s cold-cache and
          # 157s warm on a fast host; the previous 5m go-timeout killed cold
          # runs before any test could fail. 12m covers a cold race build
          # with margin inside the 20m job timeout.
          go test -race -count=1 -timeout=12m \
            ./internal/plugins/features/secretguard/... \
            ./internal/stdhttp/auth \
            ./internal/standardplugins/featurehost/secretguard \
            ./pkg/aipsdk/secretguard \
            ./internal/core/runtime \
            ./internal/infra/runtimebundle \
            2>&1 | tee .tmp/secretguard-contracts/race.log

      - name: Canonical parity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          make parity-checks 2>&1 | tee .tmp/secretguard-contracts/parity.log

      - name: CLI build and smoke
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/aipstd" ./cmd/aipstd
          "$RUNNER_TEMP/aipstd" --help > .tmp/secretguard-contracts/smoke.log 2>&1

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: secretguard-contracts-${{ github.run_id }}
          path: .tmp/secretguard-contracts/
          if-no-files-found: warn
          retention-days: 14
