name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to verify before publishing (verification only unless a tag push)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  race:
    name: Strict Linux race (${{ matrix.lane }})
    runs-on: ubuntu-latest
    # Match the maintained nightly partition: the billing and billing-store
    # scans each carry a 60-minute package bound, so neither can share a
    # 60-minute job with all lanes.
    timeout-minutes: ${{ (matrix.lane == 'billing' || matrix.lane == 'billingstore') && 75 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        lane: [broad, billing, billingstore, support, runtime, architecture]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check repository file manifest
        run: bash scripts/check-release-clean.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore shared Go cache
        uses: ./.github/actions/go-cache
        with:
          lane: race

      - name: Record tested revision
        id: revision
        shell: bash
        env:
          RACE_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          mkdir -p .tmp
          printf 'tested_sha=%s\ncommand=bash scripts/race-check.sh --strict --lane %s\n' "$tested_sha" "$RACE_LANE" | tee .tmp/race-evidence.txt
          echo "sha=$tested_sha" >> "$GITHUB_OUTPUT"

      - name: Strict Linux race detector
        env:
          RACE_LANE: ${{ matrix.lane }}
        run: bash scripts/race-check.sh --strict --lane "$RACE_LANE"

      - name: Upload strict race evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: strict-linux-race-release-${{ matrix.lane }}-${{ steps.revision.outputs.sha || github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            .tmp/race-evidence.txt
            .tmp/race-check.log
            .tmp/race-precheck.log

  verify:
    name: Verify
    needs: race
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check repository file manifest
        run: bash scripts/check-release-clean.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore shared Go cache
        uses: ./.github/actions/go-cache
        with:
          lane: ci-unit

      # The published binaries carry the toolchain's standard library, so the
      # vulnerability scan runs here, on the release toolchain, before any
      # binary is published. A release must not ship a known-vulnerable one.
      - name: Scan dependencies and reachable code
        run: go tool govulncheck ./...

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

  release:
    name: Publish binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore shared Go cache
        uses: ./.github/actions/go-cache
        with:
          lane: ci-unit

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
