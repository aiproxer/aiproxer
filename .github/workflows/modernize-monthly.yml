# Monthly Go modernization / vulnerability hygiene.
# Reports advisory modernization findings and enforces govulncheck on a schedule.
name: Modernize monthly

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 1 * *" # 04:41 UTC on the 1st of each month

permissions:
  contents: read

jobs:
  modernize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Read golangci-lint pin
        id: lint-pin
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . .github/golangci-lint.version
          set +a
          echo "version=$GOLANGCI_LINT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore shared Go cache
        uses: ./.github/actions/go-cache
        with:
          lane: qa

      # Modernize is advisory under .golangci.yml; tool/configuration failures
      # still fail this step. Keep findings visible in a downloadable report.
      # The report is uncapped and includes integration/precommit-tagged files.
      - name: golangci-lint (modernize advisory report)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v${{ steps.lint-pin.outputs.version }}
          args: --timeout=10m --enable-only=modernize --issues-exit-code=0 --max-issues-per-linter=0 --max-same-issues=0 --build-tags=integration,precommit --output.text.path=${{ runner.temp }}/modernize-report.txt

      - name: Upload modernization report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: modernization-report
          path: ${{ runner.temp }}/modernize-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: govulncheck
        if: ${{ !cancelled() }}
        run: go tool govulncheck ./...
